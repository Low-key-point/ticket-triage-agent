[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage-agent"
version = "2.0.0"
description = "中文银行咨询分类与复核工作流"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
