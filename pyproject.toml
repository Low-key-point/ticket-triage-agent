[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage-agent"
version = "3.0.0"
description = "银行工单分类、DeepSeek复核摘要与数据增强"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
